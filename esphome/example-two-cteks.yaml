# One ESP32 in the garage serving TWO CTEK Battery Sense units (two cars).
# ESP32 Bluedroid allows up to 3 simultaneous BLE connections in ESPHome.
# Free heap with two connections was ~56 KiB on a plain ESP32 (rev3.1).
esphome:
  name: ctek-garage
  friendly_name: CTEK garage

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret ctek_garage_api_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

packages:
  car1: !include
    file: ctek-battery-sense.yaml
    vars:
      ctek_id: car1
      ctek_name: "CTEK Car1"
      ctek_mac: "AA:BB:CC:DD:EE:01"
      ctek_code: "XXXXXXXXXXXXXXX1"
      ctek_skip_existing: "false"
  car2: !include
    file: ctek-battery-sense.yaml
    vars:
      ctek_id: car2
      ctek_name: "CTEK Car2"
      ctek_mac: "AA:BB:CC:DD:EE:02"
      ctek_code: "XXXXXXXXXXXXXXX2"
      ctek_skip_existing: "false"
